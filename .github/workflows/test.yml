name: Run tests
on:
  push:
    branches:
    - main
    - arm64-neon
  pull_request:
    branches:
    - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Install ImageMagick
        run: sudo apt install imagemagick
      - run: cd $GITHUB_WORKSPACE
      - run: ./test.sh

  api-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - run: cd $GITHUB_WORKSPACE
      - name: API round-trip tests with ASan and UBSan
        run: ./tests/run_api_tests.sh --profile x86-sse41 --sanitize
