name: Run tests
on:
  push:
    branches:
    - main
    - arm64-neon
  pull_request:
    branches:
    - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Install ImageMagick
        run: sudo apt install imagemagick
      - run: cd $GITHUB_WORKSPACE
      - run: ./test.sh

  api-x86-profiles:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [x86-sse41, x86-avx2]
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - run: cd $GITHUB_WORKSPACE
      - name: API correctness (${{ matrix.profile }})
        run: ./tests/run_api_tests.sh --profile ${{ matrix.profile }}

  x86-refactor-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Compare pre-M2 and current encoded bytes
        run: ./tests/compare_x86_refactor.sh

  api-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - run: cd $GITHUB_WORKSPACE
      - name: API round-trip tests with ASan and UBSan
        run: ./tests/run_api_tests.sh --profile x86-sse41 --sanitize
