name: Run tests
on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Install ImageMagick
        run: sudo apt install imagemagick
      - run: cd $GITHUB_WORKSPACE
      - run: ./test.sh

  api-x86-profiles:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [x86-sse41, x86-avx2, x86-sse41-portable-crc]
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - run: cd $GITHUB_WORKSPACE
      - name: API correctness (${{ matrix.profile }})
        run: ./tests/run_api_tests.sh --profile ${{ matrix.profile }}
      - name: Short codec soak smoke (${{ matrix.profile }})
        run: |
          ./soak.sh --profile ${{ matrix.profile }} -- \
            --width 320 --height 240 --case ui \
            --iterations 30 --warmup 3 --sample-every 10 \
            --max-drift-pct 200 --max-rss-growth-kb 32768

  x86-refactor-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Compare pre-M2 and current encoded bytes
        run: ./tests/compare_x86_refactor.sh


  api-arm64-native:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Verify native NEON backend selection
        run: ./scripts/check_aarch64_native_backend.sh
      - name: Run API correctness on native ARM64
        run: ./tests/run_api_tests.sh --profile aarch64-neon
      - name: Build generic ARMv8-A CLI
        run: ./build.sh --profile aarch64-neon
      - name: Reject optional CRC32 or PMULL instructions
        run: ./scripts/check_aarch64_baseline.sh ./build/fpnge
      - name: Smoke benchmark native NEON backend
        run: ./benchmark.sh --profile aarch64-neon -- --width 640 --height 480 --iterations 3 --warmup 1 --case ui
      - name: Short native codec soak smoke
        run: |
          for case_name in ui noise; do
            ./soak.sh --profile aarch64-neon -- \
              --width 320 --height 240 --case "${case_name}" \
              --iterations 30 --warmup 3 --sample-every 10 \
              --max-drift-pct 200 --max-rss-growth-kb 32768
          done

  api-arm64-sanitizers:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: ARM64 API round-trip tests with ASan and UBSan
        run: ./tests/run_api_tests.sh --profile aarch64-neon --sanitize

  api-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - run: cd $GITHUB_WORKSPACE
      - name: API round-trip tests with ASan and UBSan
        run: ./tests/run_api_tests.sh --profile x86-sse41 --sanitize

  package-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Verify deterministic source package
        run: ./scripts/check_reproducible_package.sh
      - name: Build and test packaged portable-CRC source
        run: |
          tmp_dir="$(mktemp -d)"
          ./scripts/package_source.sh --commit HEAD --output "${tmp_dir}/fpnge.tar.gz"
          mkdir "${tmp_dir}/src"
          tar -xzf "${tmp_dir}/fpnge.tar.gz" -C "${tmp_dir}/src"
          package_root="$(find "${tmp_dir}/src" -mindepth 1 -maxdepth 1 -type d | head -n1)"
          cd "${package_root}"
          ./build.sh --profile x86-sse41-portable-crc
          ./tests/run_api_tests.sh --profile x86-sse41-portable-crc
